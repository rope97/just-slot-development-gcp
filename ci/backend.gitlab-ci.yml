stages:
  - build
  - deploy

variables:
  REGION: europe-west1
  PROJECT_ID: just-slots-499010
  REPOSITORY: game-backend
  IMAGE: $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/api

backend:build:
  stage: build
  image: docker:24
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - echo "build-process"

    # build image
    - docker build -t $IMAGE:$CI_COMMIT_SHA ./apps/game-backend
    - docker tag $IMAGE:$CI_COMMIT_SHA $IMAGE:latest

    # GCP auth (NO KEYS - uses VM / runner identity)
    - gcloud auth configure-docker $REGION-docker.pkg.dev -q

    # push
    - docker push $IMAGE:$CI_COMMIT_SHA
    - docker push $IMAGE:latest


backend:deploy:
  stage: deploy
  image: google/cloud-sdk:slim
  script:
    - echo "=== Deploying to GKE ==="

    # authenticate via VM / attached service account
    - gcloud auth configure-docker $REGION-docker.pkg.dev -q
    - gcloud config set project $PROJECT_ID

    # get cluster credentials
    - gcloud container clusters get-credentials just-slots-dev --region $REGION

    # deploy new image
    - kubectl set image deployment/game-backend backend=$IMAGE:$CI_COMMIT_SHA
    - kubectl rollout status deployment/game-backend

    # smoke test
    - echo "=== Smoke test ==="
    - sleep 10
    - curl -f http://api-dev-justslots.duckdns.org/health || true

    - echo "SUCCESS"

  only:
    - main
