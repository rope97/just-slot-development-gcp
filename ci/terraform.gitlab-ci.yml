stages:
  - validate
  - plan
  - deploy

variables:
  TF_IN_AUTOMATION: "true"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        TF_ENV: dev
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        TF_ENV: staging
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        TF_ENV: production

terraform:fmt:
  stage: validate
  image: hashicorp/terraform:latest
  script:
    - cd terraform/environments/$TF_ENV
    - terraform fmt -check -recursive

terraform:validate:
  stage: validate
  image: hashicorp/terraform:latest
  script:
    - cd terraform/environments/$TF_ENV
    - terraform init -backend=false
    - terraform validate

terraform:plan:
  stage: plan
  image: hashicorp/terraform:latest
  script:
    - cd terraform/environments/$TF_ENV
    - terraform init
    - terraform plan -out=tfplan
    - terraform show -no-color tfplan > plan.txt
  artifacts:
    paths:
      - terraform/environments/$TF_ENV/tfplan
      - terraform/environments/$TF_ENV/plan.txt
  rules:
    - if: $CI_COMMIT_BRANCH

terraform:apply:
  stage: deploy
  image: hashicorp/terraform:latest
  script:
    - cd terraform/environments/$TF_ENV
    - terraform init
    - terraform apply -auto-approve tfplan
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH == "dev"
