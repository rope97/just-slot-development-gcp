stages:
  - validate
  - plan
  - deploy

terraform:fmt:
  stage: validate
  image: hashicorp/terraform:latest
  script:
    - cd terraform/environments/dev
    - terraform fmt -check -recursive

terraform:validate:
  stage: validate
  image: hashicorp/terraform:latest
  script:
    - cd terraform/environments/dev
    - terraform init -backend=false
    - terraform validate

terraform:plan:
  stage: plan
  image: hashicorp/terraform:latest
  script:
    - cd terraform/environments/dev
    - terraform init
    - terraform plan -out=tfplan
    - terraform show -no-color tfplan > plan.txt
  artifacts:
    paths:
      - terraform/environments/dev/tfplan
      - terraform/environments/dev/plan.txt
  only:
    - merge_requests

terraform:apply:
  stage: deploy
  image: hashicorp/terraform:latest
  needs:
    - terraform:plan
  script:
    - cd terraform/environments/dev
    - terraform init
    - terraform apply -auto-approve tfplan
  when: manual
  only:
    - main
