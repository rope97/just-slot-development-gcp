stages:
  - build
  - publish

shared-lib:build:
  stage: build
  image: node:20
  script:
    - cd apps/game-shared
    - npm ci
    - npm run build
  artifacts:
    paths:
      - apps/game-shared/dist

shared-lib:publish:
  stage: publish
  image: node:20
  script:
    - cd apps/game-shared
    - npm ci
    - npm run build

    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish
  only:
    - main
