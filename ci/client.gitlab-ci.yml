client:build:
  stage: build
  image: node:20
  script:
    - cd apps/game-client/game-client
    - npm install
    - npm run build

client:deploy:
  stage: deploy
  image: google/cloud-sdk:latest
  script:
    - echo "$GCP_SERVICE_KEY" > key.json
    - gcloud auth activate-service-account --key-file=key.json
    - gsutil -m rsync -r dist gs://just-slots-fe
  only:
    - main